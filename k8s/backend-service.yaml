apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: hrbrain
  labels:
    app: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      port: 3000          # Port interne au cluster
      targetPort: 3000    # Port du container
      nodePort: 30000     # Port accessible depuis l'extérieur (30000-32767)
