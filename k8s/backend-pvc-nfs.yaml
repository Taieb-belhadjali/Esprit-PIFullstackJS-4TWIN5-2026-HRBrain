---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-pvc-uploads
  namespace: hrbrain
  labels:
    app: backend
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: backend-pv-uploads
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-pvc-logs
  namespace: hrbrain
  labels:
    app: backend
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: backend-pv-logs
  resources:
    requests:
      storage: 2Gi
