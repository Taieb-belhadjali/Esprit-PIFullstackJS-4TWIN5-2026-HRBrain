apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: hrbrain
  labels:
    app: ollama
spec:
  # ClusterIP = accessible UNIQUEMENT depuis l'intérieur du cluster
  # Le backend appelle http://ollama-service:11434 — jamais exposé à l'extérieur
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - name: http
      protocol: TCP
      port: 11434
      targetPort: 11434
