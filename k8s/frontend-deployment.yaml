apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hrbrain
  labels:
    app: frontend
    tier: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1    # Permet de supprimer l'ancien pod avant le nouveau
  template:
    metadata:
      labels:
        app: frontend
        tier: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/path: "/metrics"
    spec:
      # ── Forcer le frontend sur Worker 1 et Worker 2 ───────────────────────
      nodeSelector:
        role: app-worker           # Même workers que le backend

      # Anti-affinity : REQUIRED - force la distribution sur des nodes différents
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: [frontend]
              topologyKey: kubernetes.io/hostname

      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30      # 30s au lieu de 300s par défaut
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30      # K8s replanifie en ~30s si un worker tombe

      containers:
        - name: frontend
          image: mouadh08/hrbrain-frontend:latest
          imagePullPolicy: IfNotPresent  # Utilise l'image en cache si déjà présente sur le node
          ports:
            - containerPort: 80
              name: http

          # Limites de ressources (nginx est très léger)
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

          # Health checks
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5   # réduit de 10s → 5s
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3   # réduit de 5s → 3s
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.1
          imagePullPolicy: IfNotPresent
          args:
            - --nginx.scrape-uri=http://localhost/stub_status
          ports:
            - containerPort: 9113
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
