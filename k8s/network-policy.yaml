---
# ── Default deny all ingress in hrbrain namespace ─────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: hrbrain
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# ── Frontend: accept HTTP from anywhere (NodePort + cluster internal) ──────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: hrbrain
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80

---
# ── Backend: accept from frontend pods + Prometheus (monitoring namespace) ─────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-ingress
  namespace: hrbrain
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 3000

---
# ── Jenkins: accept HTTP + agent port from anywhere (NodePort) ─────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jenkins-ingress
  namespace: hrbrain
spec:
  podSelector:
    matchLabels:
      app: jenkins
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
        - port: 50000

---
# ── SonarQube: accept HTTP from anywhere (NodePort) + from Prometheus ──────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sonarqube-ingress
  namespace: hrbrain
spec:
  podSelector:
    matchLabels:
      app: sonarqube
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9000

---
# ── PostgreSQL: only SonarQube pod can connect ─────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-sonarqube
  namespace: hrbrain
spec:
  podSelector:
    matchLabels:
      app: sonarqube-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sonarqube
      ports:
        - port: 5432

---
# ── Ollama: only backend pods can connect ─────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ollama-from-backend
  namespace: hrbrain
spec:
  podSelector:
    matchLabels:
      app: ollama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - port: 11434

---
# ── Default deny all ingress in monitoring namespace ──────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# ── Prometheus: accept scrape results from hrbrain namespace ──────────────────
# (Prometheus initiates the connection; this allows return traffic)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9090

---
# ── Grafana: accept from anywhere (NodePort users + Prometheus) ───────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 3000
