apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: hrbrain
  labels:
    app: sonarqube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarqube
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      # SonarQube sur app-worker
      nodeSelector:
        role: app-worker

      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30

      # SonarQube nécessite vm.max_map_count=262144
      initContainers:
        - name: init-sysctl
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              sysctl -w vm.max_map_count=262144
              sysctl -w fs.file-max=65536
          securityContext:
            privileged: true

      containers:
        - name: sonarqube
          image: sonarqube:10.3-community
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 9000

          env:
            - name: SONAR_JDBC_URL
              value: "jdbc:postgresql://sonarqube-postgres:5432/sonarqube"
            - name: SONAR_JDBC_USERNAME
              value: "sonarqube"
            - name: SONAR_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarqube-db-secrets
                  key: POSTGRES_PASSWORD
            - name: SONAR_ES_BOOTSTRAP_CHECKS_DISABLE
              value: "true"
            - name: SONAR_WEB_SYSTEMPASSCODE
              value: "sonar-monitoring-2026"

          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"

          livenessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10

          readinessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10

          volumeMounts:
            - name: sonarqube-data
              mountPath: /opt/sonarqube/data
            - name: sonarqube-extensions
              mountPath: /opt/sonarqube/extensions
            - name: sonarqube-logs
              mountPath: /opt/sonarqube/logs

      volumes:
        - name: sonarqube-data
          hostPath:
            path: /data/sonarqube-local/data   # Stockage local persistant
            type: DirectoryOrCreate
        - name: sonarqube-extensions
          persistentVolumeClaim:
            claimName: sonarqube-pvc-extensions
        - name: sonarqube-logs
          emptyDir: {}
