version: '3.8'

# ─────────────────────────────────────────────────────────────────
# HRBrain — Docker Compose (développement local)
# Usage : docker-compose up --build
# ─────────────────────────────────────────────────────────────────

services:

  # ── Backend NestJS ──────────────────────────────────────────────
  backend:
    build:
      context: ./BackOffice
      dockerfile: Dockerfile
      target: production
    container_name: hrbrain-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb+srv://taiebaminebelhadjali_db_user:Complexatom88@cluster0.wczwpwn.mongodb.net/HRBrain_db
      - JWT_SECRET=hrbrain_secret_key
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FRONTEND_URL=http://localhost:8888
      - BACKEND_URL=http://localhost:3000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    networks:
      - hrbrain-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Frontend React ──────────────────────────────────────────────
  frontend:
    build:
      context: ./FrontOffice
      dockerfile: Dockerfile
      target: production
    container_name: hrbrain-frontend
    restart: unless-stopped
    ports:
      - "8888:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hrbrain-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# ── Volumes persistants ─────────────────────────────────────────
volumes:
  backend-uploads:
  backend-logs:

# ── Réseau interne ──────────────────────────────────────────────
networks:
  hrbrain-network:
    driver: bridge
